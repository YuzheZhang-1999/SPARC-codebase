[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc-perception"
version = "0.1.0"
description = "Spectral Perception Architecture for Real-time Computing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
cuda = ["mamba-ssm>=2.2,<3", "causal-conv1d>=1.4,<2"]
dev = ["ruff>=0.6,<1"]

[project.scripts]
sparc = "sparc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
